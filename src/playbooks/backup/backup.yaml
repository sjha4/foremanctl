---
- name: Backup Databases and configuration
  hosts: quadlet
  become: true
  gather_facts: true
  vars_files:
    - "../../vars/defaults.yml"
    - "../../vars/flavors/{{ flavor }}.yml"
    - "../../vars/{{ certificates_source }}_certificates.yml"
    - "../../vars/foreman.yml"
    - "../../vars/database.yml"
    - "../../vars/base.yaml"
  pre_tasks:
    - name: Add iop databases
      when: "'iop' in enabled_features"
      block:
        - name: Include iop databases
          ansible.builtin.include_vars:
            file: "../../vars/database_iop.yml"

        - name: Combine lists
          ansible.builtin.set_fact:
            postgresql_databases: "{{ postgresql_databases + iop_postgresql_databases }}"
            postgresql_users: "{{ postgresql_users + iop_postgresql_users }}"
  roles:
    - backup
